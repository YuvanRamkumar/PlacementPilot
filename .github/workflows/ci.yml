name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Job 1: Lint + Unit / API / Data tests (always runs, FakeLLM) ─────────────
  lint-and-test:
    name: Lint + tests (unit / api / data)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: fake
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest tests/unit/ -v

      - name: API tests
        run: pytest tests/api/ -v

      - name: Data tests
        run: pytest tests/data/ -v

      # ── Newman (Postman collection) ──────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman
        run: npm install -g newman

      - name: Start API server
        run: uvicorn app.main:app --host 0.0.0.0 --port 8000 &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && break || sleep 1
          done

      - name: Newman — Postman collection
        run: newman run postman/collection.json --env-var base_url=http://localhost:8000 --bail

  # ── Job 2: Playwright UI tests ────────────────────────────────────────────────
  playwright:
    name: Playwright UI tests
    runs-on: ubuntu-latest
    needs: lint-and-test
    # Enable in Phase 6 once tests/web/ is populated.
    if: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Playwright tests
        run: pytest tests/web/ -v

  # ── Job 3: Eval suite ────────────────────────────────────────────────────────
  # When GROQ_API_KEY is set, LLM_PROVIDER=groq and all eval tests run.
  # When it is absent, LLM_PROVIDER=fake and @requires_real_llm tests auto-skip;
  # pure code checks (injection, PII) still run and must pass.
  evals:
    name: Eval suite (accuracy / grounding / hallucination / safety)
    runs-on: ubuntu-latest
    needs: lint-and-test
    env:
      LLM_PROVIDER: ${{ secrets.GROQ_API_KEY != '' && 'groq' || 'fake' }}
      LLM_BASE_URL: https://api.groq.com/openai/v1
      LLM_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_MODEL: ${{ vars.LLM_MODEL || 'openai/gpt-oss-20b' }}
      JUDGE_MODEL: ${{ vars.JUDGE_MODEL || 'openai/gpt-oss-120b' }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval suite
        run: pytest evals/ -v --tb=short

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ github.run_id }}
          path: reports/
